<div class="row">
    <div class="col-4">
      <mat-card class="cardWithShadow bg-success text-white">
        <mat-card-content>
            <mat-card-title class="text-white">Resolved</mat-card-title>
            <div class="row m-t-24">
                <div class="col-7">
                    <h4 class="f-s-24">{{inquiryCountsTotal_resolved}}</h4>
                </div>
            </div>
        </mat-card-content>
      </mat-card>
    </div>
    <div class="col-4">
      <mat-card class="cardWithShadow bg-danger text-white">
        <mat-card-content>
            <mat-card-title class="text-white">Rejected</mat-card-title>
            <div class="row m-t-24">
                <div class="col-7">
                    <h4 class="f-s-24">{{inquiryCountsTotal_rejected}}</h4>
                </div>
            </div>
        </mat-card-content>
      </mat-card>
    </div>
    <div class="col-4">
      <mat-card class="cardWithShadow bg-primary text-white">
        <mat-card-content>
            <mat-card-title class="text-white">Forwarded</mat-card-title>
            <div class="row m-t-24">
                <div class="col-7">
                    <h4 class="f-s-24">{{inquiryCountsTotal_forworded}}</h4>
                </div>
            </div>
        </mat-card-content>
      </mat-card>
    </div>
   </div>
<mat-card class="cardWithShadow">
    <mat-card-content>
        <div class="d-flex">
            <div class="m-r-auto">
                <mat-card-title>User-wise Inquiry Count</mat-card-title>
                <!-- <mat-card-subtitle>Inqueries</mat-card-subtitle> -->
            </div>
            <!-- <mat-form-field class="theme-select" appearance="outline">
                <mat-select value="mar">
                    @for(month of months; track month.value) {
                    <mat-option [value]="month.value">
                        {{ month.viewValue }}
                    </mat-option>
                    }
                </mat-select>
            </mat-form-field> -->
        </div>
        <div class="table-responsive">
            <table mat-table [dataSource]="dataSource" class="w-100">
                <!-- Position Column -->
                <ng-container matColumnDef="User">
                    <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14 p-l-0">
                        User
                    </th>
                    <td mat-cell *matCellDef="let element" class="p-l-0">
                        <div class="d-flex align-items-center">
                            <!-- <img [src]="element.imagePath" alt="users" width="48" class="rounded" /> -->
                            <div class="m-l-16">
                                <h6 class="f-s-14 f-w-600">
                                    {{ element.email }}
                                </h6>
                            </div>
                        </div>
                    </td>
                </ng-container>

                <!-- Name Column -->
                <ng-container matColumnDef="Count">
                    <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14">
                        Count
                    </th>
                    <td mat-cell *matCellDef="let element">
                        {{ element.count }}
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
            </table>
        </div>
    </mat-card-content>
</mat-card>
